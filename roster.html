<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doomstar Unit Guide</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .guide { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
      .guide h1 { margin: 0 0 8px; }
      .subtitle { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      }
      .howto { margin-bottom: 20px; }
      .howto ol { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.6; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .card-head h2 { margin: 0; font-size: 1.3rem; color: var(--text); text-transform: none; letter-spacing: 0; }
      .card-head .unit-icon { width: 48px; height: 48px; }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .stat {
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 0.8rem;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .stat strong { display: block; margin-top: 4px; font-size: 1rem; color: var(--primary); }
      .card p { margin: 12px 0 0; color: var(--muted); line-height: 1.5; }
      .role { display: inline-block; margin-top: 12px; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
      .role.crew { background: rgba(255, 122, 92, 0.18); color: #ffb09a; }
      .role.support { background: rgba(255, 255, 255, 0.06); color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="guide">
      <h1>Doomstar Unit Guide</h1>
      <p class="subtitle">
        Stats for every ship, read straight from the rules engine. Distances are in board tiles
        (the board is 33 tiles across), and range is measured hull to hull.
      </p>
      <section class="card howto">
        <h2>The Doomstar</h2>
        <ol id="howto"></ol>
      </section>
      <div id="cards" class="cards"></div>
    </div>

    <script src="engine.js"></script>
    <script src="board.js"></script>
    <script>
      (function () {
        const D = window.Doomstar;
        const Board = window.DoomstarBoard;
        const rules = D.resolveRules('doomstar');
        const ORDER = ['command', 'guard', 'scout', 'lancer', 'prism', 'nova'];

        document.getElementById('howto').innerHTML = Board.doomstarSteps(rules).map((step) => `<li>${step}</li>`).join('');
        document.getElementById('cards').innerHTML = ORDER.map((type) => {
          const unit = D.UNIT_TYPES[type];
          const stats = [['Move', unit.move], ['Range', unit.range], ['HP', unit.hp], ['Damage', unit.damage], ['Armor', unit.armor], ['Size', unit.radius]];
          if (unit.splash) stats.push(['Blast', unit.splash]);
          let role = '';
          if (type !== 'command') {
            role = rules.crew.includes(type)
              ? '<span class="role crew">Doomstar crew: charges and fires</span>'
              : '<span class="role support">Cannot charge or fire the Doomstar</span>';
          }
          return `
            <section class="card">
              <div class="card-head">
                <h2>${unit.label}</h2>
                <span>${Board.unitIcon(type, 'p1')}${Board.unitIcon(type, 'p2')}</span>
              </div>
              <div class="stats">${stats.map(([name, value]) => `<div class="stat">${name}<strong>${value}</strong></div>`).join('')}</div>
              <p>${unit.ability}</p>
              ${role}
            </section>`;
        }).join('');
      })();
    </script>
  </body>
</html>
